name: volt_pay
description: "A luxury fintech digital wallet and card payment application built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons & Luxury Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # State Management & Helpers
  provider: ^6.1.2
  intl: ^0.19.0
  local_auth: ^2.2.0    # <-- Real Device Biometrics


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0




flutter:
  uses-material-design: true